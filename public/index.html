<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanzo</title>
  <link rel="stylesheet" href="style.css">

  <!-- Polyfill BarcodeDetector : ajoute la fonction aux navigateurs qui ne l'ont pas (Safari sur iPhone).
       Si le navigateur l'a déjà (Chrome Android), il ne fait rien.
       Version figée (3.2.3) pour que rien ne change sans qu'on le décide. -->
  <script src="https://cdn.jsdelivr.net/npm/barcode-detector@3.2.3/dist/iife/polyfill.js"></script>

  <!-- supabase-js : la bibliothèque officielle pour parler à notre base Supabase (connexion, lecture, écriture).
       Version figée (2.118.0), pour la même raison que le polyfill. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>

  <!-- Nos fichiers, dans l'ordre : "defer" les lance après le chargement de la page, en gardant cet ordre. -->
  <script src="supabase.js" defer></script>
  <script src="connexion.js" defer></script>
  <script src="repli.js" defer></script>
  <script src="prix.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Scanzo</h1>

    <!-- Le compte : soit le formulaire de connexion, soit « connecté en tant que… ». -->
    <section id="compte" class="compte">
      <div id="compte-deconnecte">
        <form id="form-connexion" class="form-connexion">
          <label for="champ-email">Connecte-toi pour ajouter des prix :</label>
          <div class="ligne">
            <input id="champ-email" type="email" placeholder="ton@email.ch" autocomplete="email" required>
            <button id="bouton-lien" type="submit" class="petit">Recevoir un lien</button>
          </div>
        </form>
      </div>
      <div id="compte-connecte" class="ligne" hidden>
        <span>Connecté : <strong id="email-connecte"></strong></span>
        <button id="bouton-deconnexion" type="button" class="petit secondaire">Se déconnecter</button>
      </div>
      <p id="message-compte" class="message-compte" aria-live="polite"></p>
    </section>

    <!-- La vidéo de la caméra. "playsinline" et "muted" sont obligatoires sur iPhone,
         sinon la vidéo s'ouvre en plein écran ou ne démarre pas. -->
    <div id="zone-camera" class="zone-camera" hidden>
      <video id="video" playsinline muted autoplay></video>
      <div class="viseur"></div>
    </div>

    <p id="message" class="message">Appuie sur « Scanner » et vise le code-barres d'un produit.</p>

    <p id="resultat" class="resultat" hidden>
      Code EAN : <strong id="code-ean"></strong>
    </p>

    <!-- La fiche produit, remplie avec les données d'Open Food Facts. -->
    <article id="fiche-produit" class="fiche-produit" hidden>
      <img id="produit-photo" class="produit-photo" alt="" hidden>
      <div>
        <h2 id="produit-nom"></h2>
        <p id="produit-marque" class="produit-marque"></p>
        <p id="produit-source" class="source"></p>
      </div>
    </article>

    <!-- Les prix du produit scanné : liste + formulaire d'ajout (rempli par prix.js). -->
    <section id="section-prix" class="section-prix" hidden>
      <h2>Prix par enseigne</h2>
      <!-- Un prix par enseigne, choisi par la logique de repli (repli.js). -->
      <ul id="comparaison" class="liste-prix"></ul>
      <p class="source">Prix publics : <a href="https://prices.openfoodfacts.org" target="_blank" rel="noopener">Open Prices</a> (licence ODbL)</p>

      <h2 class="sous-titre">Tous les prix relevés dans Scanzo</h2>
      <p id="message-liste" class="message"></p>
      <ul id="liste-prix" class="liste-prix"></ul>

      <p id="prix-pas-connecte" class="message">Connecte-toi (en haut) pour ajouter un prix.</p>

      <form id="form-prix" class="form-prix" hidden>
        <h3 id="titre-form-prix">Ajouter un prix</h3>

        <!-- Visible seulement si le produit n'est connu ni d'Open Food Facts ni de Scanzo. -->
        <label id="bloc-nom-produit" hidden>
          Nom du produit (il est inconnu, tu l'ajoutes à Scanzo)
          <input id="champ-nom-produit" type="text" maxlength="200" autocomplete="off">
        </label>

        <label>
          Filiale
          <select id="champ-filiale" required></select>
        </label>

        <!-- type="text" + inputmode="decimal" : clavier chiffres sur iPhone, et on accepte 2,40 comme 2.40. -->
        <label>
          Prix en CHF
          <input id="champ-prix" type="text" inputmode="decimal" placeholder="2.40" autocomplete="off" required>
        </label>

        <label>
          Date du relevé
          <input id="champ-date" type="date" required>
        </label>

        <label class="case">
          <input id="champ-action" type="checkbox">
          En action (prix réduit temporairement)
        </label>

        <button id="bouton-enregistrer-prix" type="submit">Ajouter ce prix</button>
        <button id="bouton-annuler-correction" type="button" class="secondaire" hidden>Annuler la correction</button>
        <p id="message-prix" class="message" aria-live="polite"></p>
      </form>
    </section>

    <button id="bouton-scanner" type="button">Scanner</button>
    <button id="bouton-annuler" type="button" class="secondaire" hidden>Annuler</button>
  </main>
</body>
</html>
